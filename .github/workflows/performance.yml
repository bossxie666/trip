name: Performance baseline

on:
  push:
    branches: [v2.4-r1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Locate Google Chrome
        run: |
          repair_chrome_path="$(command -v google-chrome || command -v google-chrome-stable)"
          test -x "$repair_chrome_path"
          echo "CHROME_PATH=$repair_chrome_path" >> "$GITHUB_ENV"
          "$repair_chrome_path" --version
      - name: Configure local-only test credentials
        run: |
          printf '%s\n' 'TRIP_SPACE_INVITE_CODE=test-invite' 'TRIP_SPACE_SESSION_SECRET=test-session-secret-at-least-32-characters' 'AMAP_JS_API_KEY=test-js-key' 'AMAP_JS_SECURITY_CODE=test-js-code' 'AMAP_WEB_SERVICE_KEY=test-web-key' > .dev.vars
      - name: Prepare production-like local D1
        run: |
          pnpm exec wrangler d1 migrations apply DB --local
          pnpm exec wrangler d1 execute DB --local --file scripts/e2e-seed.sql
      - run: pnpm build:self-hosted
      - name: Lighthouse production-like routes
        run: pnpm exec lhci autorun
      - name: Verify authenticated performance reports
        if: always()
        run: node scripts/check-lighthouse-reports.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: |
            .lighthouseci/reports
            .lighthouseci/lhr-*.json
          include-hidden-files: true
          retention-days: 14
