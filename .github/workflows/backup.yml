name: Weekly D1 backup
on:
  schedule:
    - cron: "41 18 * * 0"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-d1-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate backup credentials before contacting Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Backup credentials are not configured in GitHub Actions. No Production export was attempted."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export and copy the backup to isolated R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          mkdir -p backups
          pnpm exec wrangler d1 export DB --remote --output "backups/trip-${stamp}.sql"
          pnpm exec wrangler r2 object put "trip-archive-backups/d1/trip-${stamp}.sql" --remote --file "backups/trip-${stamp}.sql"
          pnpm exec wrangler d1 execute DB --remote --command "PRAGMA foreign_key_check;"
      # SQL contains private member and trip data; never publish it as a
      # GitHub Actions artifact, especially while the mirror is public.
