name: Quality
on:
  pull_request:
  push:
    branches: [v2.4-r1]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
  browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Configure isolated browser-test environment
        run: |
          printf '%s\n' 'TRIP_SPACE_INVITE_CODE=test-invite' 'TRIP_SPACE_SESSION_SECRET=test-session-secret-at-least-32-characters' 'AMAP_JS_API_KEY=test-js-key' 'AMAP_JS_SECURITY_CODE=test-js-code' 'AMAP_WEB_SERVICE_KEY=test-web-key' > .dev.vars
      - run: pnpm exec wrangler d1 migrations apply DB --local
      - run: pnpm exec wrangler d1 execute DB --local --file scripts/e2e-seed.sql
      - run: pnpm build:self-hosted
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
